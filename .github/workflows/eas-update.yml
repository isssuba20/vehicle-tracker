name: EAS Update

on:
  push:
    branches:
      - claude/multi-vehicle-maintenance-tracker-9qihjx
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: "Update channel to publish to"
        required: true
        default: "preview"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          CHANNEL="$INPUT_CHANNEL"
          if [ -z "$CHANNEL" ]; then
            if [ "$REF_NAME" = "main" ]; then
              CHANNEL="production"
            else
              CHANNEL="preview"
            fi
          fi
          MESSAGE="${COMMIT_MESSAGE:-Manual update}"
          MESSAGE="${MESSAGE%%$'\n'*}"
          eas update --channel "$CHANNEL" --message "$MESSAGE"
